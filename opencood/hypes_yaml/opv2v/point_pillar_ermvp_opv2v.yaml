name: point_pillar_ermvp_opv2v

# Change these three paths to the extracted OPV2V splits.
root_dir: dataset/OPV2V/train
validate_dir: dataset/OPV2V/validate
test_dir: dataset/OPV2V/test
comm_range: 70

input_source: [lidar]
label_type: lidar
add_data_extension: []

yaml_parser: load_point_pillar_params

train_params:
  batch_size: 4
  epoches: &epoches 50
  eval_freq: 4
  save_freq: 4
  max_cav: &max_cav 5
  num_workers: 4
  prefetch_factor: 2

fusion:
  core_method: intermediate
  dataset: opv2v
  args:
    proj_first: false

preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-70.4, -38.4, -3, 70.4, 38.4, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [x]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: VoxelPostprocessor
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    num: &anchor_num 2
    feature_stride: 4
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_fusion_opv2v
  args:
    fusion_method: ermvp
    supervise_single: false
    single_head_shared: true
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    head_dim: 256
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384
    ermvp:
      input_dim: 256
      model_dim: 256
      agent_size: *max_cav
      window_size: 4
      dim_head: 32
      mlp_dim: 256
      drop_out: 0.1
      depth: 3
      global_query_downsample_stages: 2
      topk_ratio: 0.2
      cluster_sample_ratio: 0.2
      cluster_neighbors: 10
      enable_aei: false
      aei_kernel_size: 3
      spatial_downsample_stages: 0

loss:
  core_method: point_pillar_loss_opv2v
  args:
    cls_weight: 1.0
    reg: 2.0
    alpha: 0.25
    gamma: 2.0

optimizer:
  core_method: Adam
  lr: 2.0e-4
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-2

lr_scheduler:
  core_method: cosineannealwarm
  epoches: *epoches
  warmup_lr: 2.0e-5
  warmup_epoches: 10
  lr_min: 5.0e-6
